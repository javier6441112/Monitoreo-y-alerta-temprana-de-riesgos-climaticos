services:
  db:
    build:
      context: ./BaseDeDatos
      dockerfile: Dockerfile
    container_name: climate-risk-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-desa123$}
      DB_NAME: ${DB_NAME:-ClimateRiskDb}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - climate-risk-network

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: climate-risk-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=climate-risk-db,1433;Database=${DB_NAME:-ClimateRiskDb};User Id=sa;Password=${MSSQL_SA_PASSWORD:-desa123$};TrustServerCertificate=True;Encrypt=False"
    ports:
      - "${API_PORT:-5000}:8080"
    networks:
      - climate-risk-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: climate-risk-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - climate-risk-network

volumes:
  sqlserver-data:
    name: climate-risk-sqlserver-data

networks:
  climate-risk-network:
    name: climate-risk-network