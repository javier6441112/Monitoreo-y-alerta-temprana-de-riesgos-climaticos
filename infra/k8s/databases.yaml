apiVersion: v1
kind: Service
metadata:
  name: auth-postgres
  namespace: climate
spec:
  selector: {app: auth-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-postgres
  namespace: climate
spec:
  serviceName: auth-postgres
  replicas: 1
  selector: {matchLabels: {app: auth-postgres}}
  template:
    metadata: {labels: {app: auth-postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17-bookworm
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: auth}
            - {name: POSTGRES_USER, value: auth}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: climate-secrets, key: POSTGRES_PASSWORD}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
          readinessProbe: {tcpSocket: {port: 5432}, initialDelaySeconds: 5, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 8Gi}}}
---
