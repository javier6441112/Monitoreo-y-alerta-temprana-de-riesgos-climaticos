apiVersion: v1
kind: Service
metadata:
  name: sensor-db
  namespace: climate
spec:
  selector: {app: sensor-db}
  ports: [{port: 1433, targetPort: 1433}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sensor-db
  namespace: climate
spec:
  serviceName: sensor-db
  replicas: 1
  selector: {matchLabels: {app: sensor-db}}
  template:
    metadata: {labels: {app: sensor-db}}
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports: [{containerPort: 1433}]
          env:
            - {name: ACCEPT_EULA, value: "Y"}
            - {name: MSSQL_PID, value: Developer}
            - name: MSSQL_SA_PASSWORD
              valueFrom: {secretKeyRef: {name: climate-secrets, key: MSSQL_SA_PASSWORD}}
          resources: {requests: {cpu: 750m, memory: 1536Mi}, limits: {cpu: "2", memory: 2500Mi}}
          readinessProbe: {tcpSocket: {port: 1433}, initialDelaySeconds: 30, periodSeconds: 10, failureThreshold: 12}
          volumeMounts: [{name: data, mountPath: /var/opt/mssql}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 30Gi}}}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: climate
spec:
  selector: {app: mongo}
  ports: [{port: 27017, targetPort: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: climate
spec:
  serviceName: mongo
  replicas: 1
  selector: {matchLabels: {app: mongo}}
  template:
    metadata: {labels: {app: mongo}}
    spec:
      containers:
        - name: mongo
          image: mongo:8
          ports: [{containerPort: 27017}]
          env:
            - {name: MONGO_INITDB_ROOT_USERNAME, value: root}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: climate-secrets, key: MONGO_ROOT_PASSWORD}}
            - name: MONGO_REPORT_PASSWORD
              valueFrom: {secretKeyRef: {name: climate-secrets, key: MONGO_REPORT_PASSWORD}}
            - name: MONGO_AUDIT_PASSWORD
              valueFrom: {secretKeyRef: {name: climate-secrets, key: MONGO_AUDIT_PASSWORD}}
          resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 750m, memory: 768Mi}}
          readinessProbe: {tcpSocket: {port: 27017}, initialDelaySeconds: 10, periodSeconds: 5}
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: init, mountPath: /docker-entrypoint-initdb.d/init.js, subPath: init.js, readOnly: true}
      volumes:
        - name: init
          configMap: {name: mongo-init}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 16Gi}}}
