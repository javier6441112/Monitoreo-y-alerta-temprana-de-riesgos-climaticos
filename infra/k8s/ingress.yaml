apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: climate-public
  namespace: climate
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [desawebproyectoclimatico.dpdns.org]
  rules:
    - host: desawebproyectoclimatico.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {number: 80}}
