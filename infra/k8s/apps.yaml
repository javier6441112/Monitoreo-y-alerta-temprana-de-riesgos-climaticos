apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: climate}
spec: {selector: {app: frontend}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: climate}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: weather-risk-frontend:phase4
          imagePullPolicy: Never
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          livenessProbe: {tcpSocket: {port: 80}, initialDelaySeconds: 10, periodSeconds: 15}
          readinessProbe: {tcpSocket: {port: 80}, initialDelaySeconds: 5, periodSeconds: 5}
