apiVersion: v1
kind: Service
metadata: {name: auth, namespace: climate}
spec: {selector: {app: auth}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: auth, namespace: climate}
spec:
  replicas: 1
  selector: {matchLabels: {app: auth}}
  template:
    metadata: {labels: {app: auth}}
    spec:
      containers:
        - name: auth
          image: weather-risk-auth:phase4
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: climate-config}}, {secretRef: {name: climate-secrets}}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: climate-secrets, key: AUTH_DATABASE_URL}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 20, periodSeconds: 15}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, initialDelaySeconds: 10, periodSeconds: 5}
---
