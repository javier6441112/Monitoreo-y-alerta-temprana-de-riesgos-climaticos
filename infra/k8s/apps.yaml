apiVersion: v1
kind: Service
metadata: {name: alert, namespace: climate}
spec: {selector: {app: alert}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alert, namespace: climate}
spec:
  replicas: 1
  selector: {matchLabels: {app: alert}}
  template:
    metadata: {labels: {app: alert}}
    spec:
      containers:
        - name: alert
          image: weather-risk-alert:phase4
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: climate-config}}, {secretRef: {name: climate-secrets}}]
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: climate-secrets, key: ALERT_DATABASE_URL}}}
            - {name: DATABASE_USER, value: alert}
            - {name: DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: climate-secrets, key: POSTGRES_PASSWORD}}}
          resources: {requests: {cpu: 200m, memory: 384Mi}, limits: {cpu: "1", memory: 768Mi}}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 45, periodSeconds: 20}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, initialDelaySeconds: 30, periodSeconds: 10}
---
