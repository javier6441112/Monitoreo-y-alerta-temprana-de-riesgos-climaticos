apiVersion: v1
kind: ConfigMap
metadata:
  name: climate-config
  namespace: climate
data:
  JWT_ISSUER: WeatherRisk.Auth
  JWT_AUDIENCE: WeatherRisk
  AUTH_URL: http://auth:8080
  COMMUNITY_URL: http://community:8080
  SENSOR_URL: http://sensor:8080
  ALERT_URL: http://alert:8080
  REPORT_URL: http://report:8080
  AUDIT_URL: http://audit:8080
  MONGO_REPORT_DATABASE: report
  MONGO_AUDIT_DATABASE: audit
  CORS_ORIGINS: https://desawebproyectoclimatico.dpdns.org
  PUBLIC_URL: https://desawebproyectoclimatico.dpdns.org
